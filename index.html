<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Praktikum 1 - Perkenalan Diri</title>
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
</head>
<body>
  <a-scene>
    <a-text value="Tegar Raya Harahap - 2409020069" position="0 2.5 -3" align="center" color="#222222" width="6"></a-text>
    <a-box position="-1.5 0.75 -3" rotation="0 30 0" width="1" height="1.5" depth="1" color="#7E57C2"
      animation="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear"></a-box>
    <a-sphere position="0 1.25 -4" radius="0.9" color="#26A69A"></a-sphere>
    <a-cylinder position="1.5 0.9 -3" radius="0.5" height="1.8" color="#FF7043"></a-cylinder>
    <a-cone position="-3 0.8 -5" radius-bottom="0.8" radius-top="0" height="1.6" color="#FFD54F"></a-cone>
    <a-torus position="3 1 -5" radius="0.7" radius-tubular="0.2" rotation="45 0 0" color="#EC407A"></a-torus>
    <a-plane position="0 0 -4" rotation="-90 0 0" width="12" height="12" color="#C5CAE9"></a-plane>
    <a-sky color="#FDE7F3"></a-sky>
  </a-scene>
</body>
</html>
